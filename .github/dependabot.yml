version: 2
updates:
  # Runtime deps across the workspace. Grouped so a routine week is one PR to
  # review rather than a dozen; majors stay separate because they need thought.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
